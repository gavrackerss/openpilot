name: XNOR V1.1 UK and ALC validation

on:
  push:
    branches:
      - xnor-v1-1-uk-alc-fix
    paths:
      - .github/workflows/xnor-v11uk-alc-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xnor-v1-1-uk-alc-fix

      - name: Python syntax
        run: |
          python -m py_compile \
            selfdrive/speed_limit_uk_reader.py \
            selfdrive/speed_limit_vision_uk.py \
            selfdrive/controls/lib/desire_helper.py \
            opendbc_repo/opendbc/car/tesla/carstate.py \
            opendbc_repo/opendbc/car/tesla/carcontroller.py

      - name: Install reader test dependencies
        run: python -m pip install -q numpy opencv-python-headless==4.13.0.92 pillow

      - name: Test UK value reader on independent-font synthetic signs
        run: |
          PYTHONPATH=. python - <<'PY'
          import cv2
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from selfdrive.speed_limit_uk_reader import UKSpeedValueReader

          reader = UKSpeedValueReader(cv2)
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          def sign(value, size=240, angle=0.0, blur=0.0):
            im = Image.new("RGB", (size, size), "white")
            d = ImageDraw.Draw(im)
            margin = int(size * 0.07)
            ring = max(int(size * 0.075), 8)
            d.ellipse((margin, margin, size-margin, size-margin), outline=(210, 0, 0), width=ring)
            font = ImageFont.truetype(font_path, int(size * 0.43))
            text = str(value)
            box = d.textbbox((0, 0), text, font=font)
            tw, th = box[2]-box[0], box[3]-box[1]
            d.text(((size-tw)/2, (size-th)/2 - int(size*0.035)), text, font=font, fill="black")
            if angle:
              im = im.rotate(angle, resample=Image.Resampling.BICUBIC, fillcolor="white")
            if blur:
              im = im.filter(ImageFilter.GaussianBlur(blur))
            return cv2.cvtColor(np.asarray(im), cv2.COLOR_RGB2BGR)

          failures = []
          for value in (20, 30, 40, 50, 60, 70):
            reads = []
            for size, angle, blur in ((240,0,0),(180,2,0.5),(140,-3,0.7),(110,1.5,0.5)):
              result = reader.read(sign(value, size, angle, blur))
              got = None if result is None else result.speed_limit_mph
              conf = 0.0 if result is None else result.confidence
              reads.append((size, angle, blur, got, round(conf,3)))
              if got != value:
                failures.append((value,size,angle,blur,got,conf))
            print(value, reads)
          if failures:
            raise SystemExit(f"UK reader failures: {failures}")
          PY

      - name: Validate new CarState schema fields
        run: |
          grep -F 'teslaAlcHandoverReady @63 :Bool;' opendbc_repo/opendbc/car/car.capnp
          grep -F 'teslaEacStatus @64 :UInt8;' opendbc_repo/opendbc/car/car.capnp
          grep -F 'teslaEacError @65 :UInt8;' opendbc_repo/opendbc/car/car.capnp
          test "$(readlink cereal/car.capnp)" = "../opendbc_repo/opendbc/car/car.capnp"

      - name: Package changed-files overlay
        run: |
          set -euo pipefail
          rm -rf /tmp/xnor-v11
          mkdir -p /tmp/xnor-v11
          files=(
            opendbc_repo/opendbc/car/car.capnp
            opendbc_repo/opendbc/car/tesla/carcontroller.py
            opendbc_repo/opendbc/car/tesla/carstate.py
            selfdrive/controls/lib/desire_helper.py
            selfdrive/speed_limit_uk_reader.py
            selfdrive/speed_limit_vision_uk.py
          )
          for f in "${files[@]}"; do
            mkdir -p "/tmp/xnor-v11/$(dirname "$f")"
            cp "$f" "/tmp/xnor-v11/$f"
          done
          cd /tmp/xnor-v11
          zip -r "$GITHUB_WORKSPACE/xnor-v1.1-uk-alc-fix-changed-files.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: xnor-v1.1-uk-alc-fix-changed-files
          path: xnor-v1.1-uk-alc-fix-changed-files.zip
          if-no-files-found: error
          retention-days: 7
