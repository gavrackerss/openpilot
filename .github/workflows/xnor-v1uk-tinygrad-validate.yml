name: XNOR V1 UK OpenCV runtime package

on:
  push:
    branches:
      - xnor-speed-limit-v1-uk-tinygrad
    paths:
      - .github/workflows/xnor-v1uk-tinygrad-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xnor-speed-limit-v1-uk-tinygrad
          lfs: true

      - name: Syntax check
        run: python -m py_compile selfdrive/speed_limit_vision_uk.py

      - name: Fetch pinned ARM64 OpenCV runtime
        shell: bash
        run: |
          set -euo pipefail
          dir="selfdrive/assets/vision_runtime"
          wheel="opencv_python_headless-4.13.0.92-cp37-abi3-manylinux2014_aarch64.manylinux_2_17_aarch64.whl"
          mkdir -p "$dir"
          curl -fL --retry 3 \
            https://files.pythonhosted.org/packages/21/76/9417a6aef9def70e467a5bf560579f816148a4c658b7d525581b356eda9e/opencv_python_headless-4.13.0.92-cp37-abi3-manylinux2014_aarch64.manylinux_2_17_aarch64.whl \
            -o "$dir/$wheel"
          echo "5c8cfc8e87ed452b5cecb9419473ee5560a989859fe1d10d1ce11ae87b09a2cb  $dir/$wheel" | sha256sum -c -
          test "$(stat -c%s "$dir/$wheel")" = "33703709"
          unzip -l "$dir/$wheel" | grep -E 'cv2/cv2.*\.so'
          unzip -l "$dir/$wheel" | grep -E 'opencv_python_headless\.libs/'

      - name: Validate wheel extraction/import pattern on runner architecture
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q numpy
          curl -fL --retry 3 \
            https://files.pythonhosted.org/packages/92/ce/bd17ff5772938267fd49716e94ca24f616ff4cb1ff4c6be13085108037be/opencv_python_headless-4.13.0.92-cp37-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl \
            -o /tmp/opencv-x86.whl
          echo "0525a3d2c0b46c611e2130b5fdebc94cf404845d8fa64d2f3a3b679572a5bd22  /tmp/opencv-x86.whl" | sha256sum -c -
          rm -rf /tmp/xnor-cv2-test
          mkdir -p /tmp/xnor-cv2-test
          python - <<'PY'
          import importlib
          import pathlib
          import sys
          import zipfile
          wheel = pathlib.Path("/tmp/opencv-x86.whl")
          target = pathlib.Path("/tmp/xnor-cv2-test")
          with zipfile.ZipFile(wheel, "r") as zf:
            zf.extractall(target)
          sys.path.insert(0, str(target))
          importlib.invalidate_caches()
          import cv2
          print("vendored cv2:", cv2.__version__, cv2.__file__)
          assert cv2.__version__ == "4.13.0"
          assert str(target) in cv2.__file__
          PY

      - name: Package cumulative V1 UK overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/xnor-v1uk
          mkdir -p /tmp/xnor-v1uk
          files=(
            common/params_keys.h
            opendbc_repo/opendbc/car/tesla/carstate.py
            pyproject.toml
            selfdrive/assets/vision_models/speed_limit_vision.onnx
            selfdrive/assets/vision_runtime/opencv_python_headless-4.13.0.92-cp37-abi3-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
            selfdrive/speed_limit_vision_uk.py
            selfdrive/ui/layouts/settings/tesla.py
            system/manager/process_config.py
            uv.lock
          )
          for f in "${files[@]}"; do
            mkdir -p "/tmp/xnor-v1uk/$(dirname "$f")"
            cp "$f" "/tmp/xnor-v1uk/$f"
          done
          cd /tmp/xnor-v1uk
          zip -r "$GITHUB_WORKSPACE/xnor-speed-limit-v1-uk-opencv-runtime-changed-files.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: xnor-speed-limit-v1-uk-opencv-runtime-changed-files
          path: xnor-speed-limit-v1-uk-opencv-runtime-changed-files.zip
          if-no-files-found: error
          retention-days: 7
