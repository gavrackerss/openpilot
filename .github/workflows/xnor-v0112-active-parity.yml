name: XNOR 0.11.2 active Tesla parity

on:
  pull_request:
    branches: [xnor-dev]
    paths:
      - 'opendbc_repo'
      - 'openpilot/selfdrive/controls/controlsd.py'
      - 'openpilot/selfdrive/ui/onroad/hud_renderer.py'
      - 'openpilot/selfdrive/ui/onroad/manual_speed_limit.py'
      - 'openpilot/selfdrive/ui/mici/onroad/hud_renderer.py'
      - 'openpilot/selfdrive/ui/mici/onroad/augmented_road_view.py'
      - 'tests/test_xnor_v0112_active_parity.py'
      - 'tests/test_xnor_v0112_native_pedal_inhibit.py'
      - '.github/workflows/xnor-v0112-active-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-parity:
    name: V229/V234/V241/V279 source and compiled safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify active Openpilot parity contracts
        run: |
          python3 tests/test_xnor_v0112_active_parity.py -v
          python3 tests/test_xnor_v0112_native_pedal_inhibit.py -v
          python3 -m py_compile \
            openpilot/selfdrive/controls/controlsd.py \
            openpilot/selfdrive/ui/onroad/manual_speed_limit.py \
            openpilot/selfdrive/ui/onroad/hud_renderer.py \
            openpilot/selfdrive/ui/mici/onroad/hud_renderer.py \
            openpilot/selfdrive/ui/mici/onroad/augmented_road_view.py

      - name: Run pinned opendbc compiled safety suite
        working-directory: opendbc_repo
        shell: bash
        run: |
          # Run the complete compiled suite. The fork's pre-existing custom safety
          # extensions do not meet upstream's global 100% gcov threshold, so use
          # the test phase directly rather than test.sh's unrelated coverage gate.
          source setup.sh
          python -m unittest discover -s opendbc/safety/tests


  linux-integration:
    name: Tesla fix Linux lint + build + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install headless GLES runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgles2 libegl1
      - name: Set up openpilot
        run: ./tools/op.sh setup
      - name: Static analysis
        run: scripts/lint/lint.sh
      - name: Build openpilot
        run: scons
      - name: Run unit tests
        env:
          RAYLIB_BACKEND: headless
        run: tools/op.sh test
