name: VSL V2 classifier POC

on:
  push:
    branches:
      - xnor-dev-v2-speed-classifier-poc
    paths:
      - selfdrive/vsl_v2_poc/train_classifier.py
      - .github/workflows/vsl-v2-classifier-poc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install opencv-python-headless pillow requests onnx onnxscript

      - name: Train classifier
        run: |
          python selfdrive/vsl_v2_poc/train_classifier.py --output v2_out --epochs 6

      - name: Upload V2 POC artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsl-v2-classifier-poc
          path: v2_out/
          if-no-files-found: warn
          retention-days: 7
