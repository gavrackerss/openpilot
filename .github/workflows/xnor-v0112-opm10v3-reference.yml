name: XNOR 0.11.2 OPM10V3 split-model CPU reference
on:
  push:
    branches: ['upgrade/xnor-v0112-xnor-base']
    paths:
      - 'tools/xnor_v0112_opm10v3_reference.py'
      - '.github/workflows/xnor-v0112-opm10v3-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: xnor
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: commaai/openpilot
          ref: 7d4c295c27bc3f72727c49ec73b98e45745b588d
          path: upstream
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact three ONNX graphs
        working-directory: upstream
        run: git lfs pull --include='selfdrive/modeld/models/driving_vision.onnx,selfdrive/modeld/models/driving_on_policy.onnx,selfdrive/modeld/models/driving_off_policy.onnx' --exclude=''
      - name: Install CPU reference dependencies
        run: python -m pip install 'numpy==2.2.6' 'onnxruntime==1.22.1'
      - name: Run recurrent split inference against original parser
        working-directory: xnor
        run: python tools/xnor_v0112_opm10v3_reference.py --source-checkout ../upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opm10v3-reference-report
          path: xnor/opm10v3-reference.json
          if-no-files-found: error
      - name: Qualification boundary
        run: echo 'CPU synthetic reference only. No AGNOS runtime, CAN, cruise commands or vehicle control.'
