name: VSL V2 dataset prepare

on:
  push:
    branches:
      - xnor-dev-v2-speed-classifier-poc
    paths:
      - selfdrive/vsl_v2_poc/train_classifier.py
      - .github/workflows/vsl-v2-dataset-prepare.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preparation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install opencv-python-headless pillow requests
      - name: Prepare labelled UK sign dataset
        run: |
          python selfdrive/vsl_v2_poc/train_classifier.py --output v2_dataset --prepare-only
      - name: Upload prepared dataset
        uses: actions/upload-artifact@v4
        with:
          name: vsl-v2-prepared-dataset
          path: v2_dataset/
          retention-days: 7
