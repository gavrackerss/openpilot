name: VSL V2 dataset prepare

# Kept as an explicit diagnostic/preparation job. The classifier workflow
# already prepares the same sources; auto-running both doubles Wikimedia
# traffic and can trip unauthenticated rate limits.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preparation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install opencv-python-headless pillow requests
      - name: Prepare labelled UK sign dataset
        run: |
          python selfdrive/vsl_v2_poc/train_classifier.py --output v2_dataset --prepare-only
      - name: Upload prepared dataset
        uses: actions/upload-artifact@v4
        with:
          name: vsl-v2-prepared-dataset
          path: v2_dataset/
          retention-days: 7
