name: V241 VSL V3 conflict capture

on:
  push:
    branches:
      - xnor-dev-v241-vsl-v3-conflict-capture
    paths:
      - .github/workflows/v241-shadow-conflict-capture.yml
      - selfdrive/speed_limit_vision_uk.py
      - common/params_keys.h
      - selfdrive/vsl_v3/export_shadow_samples.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install helper-test dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Syntax-check V241 runtime
        run: |
          python -m py_compile selfdrive/speed_limit_vision_uk.py
          python -m py_compile selfdrive/vsl_v3/export_shadow_samples.py

      - name: Verify Params and shadow-only boundary
        shell: bash
        run: |
          set -euo pipefail
          for key in             VisionSpeedLimitV3Class             VisionSpeedLimitV3Confidence             VisionSpeedLimitV3Consensus             VisionSpeedLimitV3Decision             VisionSpeedLimitV3OcrClass             VisionSpeedLimitV3OcrCount             VisionSpeedLimitV3Timestamp; do
            grep -q "\"$key\"" common/params_keys.h
          done
          if git grep -nE 'get(_bool|_int)?\([^\n]*VisionSpeedLimitV3|params\.get[^\n]*VisionSpeedLimitV3' -- ':!selfdrive/speed_limit_vision_uk.py' ':!common/params_keys.h'; then
            echo "V3 diagnostic Param is consumed outside the shadow daemon"
            exit 1
          fi
          grep -q 'V3_CONFLICT' selfdrive/speed_limit_vision_uk.py
          grep -q 'V3_RESCUE' selfdrive/speed_limit_vision_uk.py
          grep -q 'xnor_vsl_shadow_samples/v241' selfdrive/speed_limit_vision_uk.py
          grep -q 'authoritative=0' selfdrive/speed_limit_vision_uk.py

      - name: Exercise OCR conflict and rescue semantics
        run: |
          python - <<'PY'
          import ast
          from collections import Counter, deque
          from dataclasses import dataclass
          import numpy as np

          path = "selfdrive/speed_limit_vision_uk.py"
          tree = ast.parse(open(path).read(), path)
          cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == "SpeedLimitVisionUK")
          wanted = {
            "_bbox_iou", "_shadow_same_object",
            "_shadow_record_ocr", "_shadow_ocr_consensus",
            "_shadow_update_temporal",
          }
          methods = [n for n in cls.body if isinstance(n, ast.FunctionDef) and n.name in wanted]
          mod = ast.fix_missing_locations(ast.Module(body=[
            ast.ClassDef(name="T", bases=[], keywords=[], body=methods, decorator_list=[])
          ], type_ignores=[]))

          @dataclass
          class ShadowHistoryEntry:
            class_name: str
            confidence: float
            crop_consensus: float
            created_at: float

          @dataclass
          class ShadowOcrEntry:
            speed_limit_mph: int
            confidence: float
            created_at: float
            bbox: tuple | None
            source: str

          class FakeTime:
            t = 100.0
            @classmethod
            def monotonic(cls):
              return cls.t

          class Cloudlog:
            messages = []
            @classmethod
            def info(cls, msg):
              cls.messages.append(msg)

          ns = {
            "np": np,
            "Counter": Counter,
            "deque": deque,
            "ShadowHistoryEntry": ShadowHistoryEntry,
            "ShadowOcrEntry": ShadowOcrEntry,
            "SHADOW_TEMPORAL_SECONDS": 2.0,
            "SHADOW_OCR_SECONDS": 2.5,
            "SHADOW_OCR_REQUIRED": 2,
            "SHADOW_OCR_MIN_CONFIDENCE": 0.72,
            "SHADOW_MIN_DECISION_CONFIDENCE": 0.60,
            "SHADOW_MIN_DECISION_CONSENSUS": 0.60,
            "SUPPORTED_UK_LIMITS_MPH": frozenset((20,30,40,50,60,70)),
            "time": FakeTime,
            "cloudlog": Cloudlog,
          }
          exec(compile(mod, path, "exec"), ns)
          t = ns["T"]()
          t._shadow_track_bbox = None
          t._shadow_event_anchor_class = ""
          t._shadow_last_observation_at = 0.0
          t._shadow_history = deque()
          t._shadow_ocr_history = deque()
          t.published_speed_limit_mph = 40
          writes = []
          t._shadow_write_params = lambda c, conf, con, dec, ospeed, ocount, now: writes.append((c, dec, ospeed, ocount, con))

          box = (100,100,150,150)
          t._shadow_record_ocr("detector", 40, .86, box)
          FakeTime.t += .10
          t._shadow_record_ocr("numeric_track", 40, .85, box)
          FakeTime.t += .10
          t._shadow_update_temporal("40", .88, 1.0, box, 40, "numeric_proposal")
          FakeTime.t += .25
          result = t._shadow_update_temporal("40", .90, 1.0, (102,101,152,151), 40, "numeric_track")
          assert result["decision"] == "V3_CONFIRM", result
          assert t._shadow_event_anchor_class == "40"

          # Same physical sign: V3 later flips to 20 while repeated OCR stays 40.
          t._shadow_history.clear()
          FakeTime.t += .25
          t._shadow_update_temporal("20", .92, 1.0, (104,102,154,152), 20, "numeric_track")
          FakeTime.t += .25
          result = t._shadow_update_temporal("20", .93, 1.0, (106,103,156,153), 20, "numeric_track")
          assert result["decision"] == "V3_CONFLICT", result
          assert result["ocr_speed"] == 40 and result["ocr_count"] >= 2

          # New sign: mature V3 + one matching raw OCR, but not published => rescue.
          t._shadow_track_bbox = None
          t._shadow_event_anchor_class = ""
          t._shadow_history.clear()
          t._shadow_ocr_history.clear()
          t.published_speed_limit_mph = 40
          newbox = (300,100,350,150)
          FakeTime.t += 3.0
          t._shadow_record_ocr("detector_partial", 30, .86, newbox)
          FakeTime.t += .10
          t._shadow_update_temporal("30", .90, 1.0, newbox, 60, "numeric_proposal")
          FakeTime.t += .30
          result = t._shadow_update_temporal("30", .93, 1.0, (302,101,352,151), 60, "numeric_proposal")
          assert result["decision"] == "V3_RESCUE", result

          print("V241 conflict/rescue helper tests: PASS")
          PY

      - name: Package changed source files
        uses: actions/upload-artifact@v4
        with:
          name: v241-shadow-conflict-capture-source
          path: |
            selfdrive/speed_limit_vision_uk.py
            common/params_keys.h
            selfdrive/vsl_v3/export_shadow_samples.py
          retention-days: 14
