name: CTM guarded modeld and parked Jetlink regression checks
on:
  push:
    branches: [xnor-dev]
    paths:
      - '.github/workflows/ctm-park-integration-check.yml'
      - 'openpilot/jetlink_shadow_bench.py'
      - 'openpilot/jetlink_authority.py'
      - 'openpilot/jetlink_native_authority.py'
      - 'openpilot/jetlink_usb_peer.py'
      - 'tests/test_jetlink_usb_peer.py'
      - 'tools/check_jetlink_ls2.py'
      - 'openpilot/jetlink_ctm_contract.py'
      - 'openpilot/jetlink_ctm_adapter.py'
      - 'openpilot/jetlink_ctm_authority_gate.py'
      - 'selfdrive/modeld/modeld.py'
      - 'system/manager/process_config.py'
      - 'openpilot/jetlink_ctm_park_handover.py'
      - 'tools/run_jetlink_ctm_handover_park.sh'
      - 'tests/test_jetlink_ctm_contract.py'
      - 'tests/test_jetlink_ctm_authority_gate.py'
      - 'tools/check_jetlink_ctm_authority.py'
      - 'tools/disarm_jetlink_ctm_authority.sh'
      - 'tools/jetlink_ctm_markers.sh'
      - 'tools/run_jetlink_ctm_park.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python and Bash syntax
        run: |
          set -euo pipefail
          python3 -m py_compile openpilot/jetlink_shadow_bench.py openpilot/jetlink_authority.py openpilot/jetlink_native_authority.py openpilot/jetlink_usb_peer.py tests/test_jetlink_usb_peer.py tools/check_jetlink_ls2.py
          python3 -m py_compile openpilot/jetlink_ctm_contract.py openpilot/jetlink_ctm_adapter.py openpilot/jetlink_ctm_authority_gate.py openpilot/jetlink_ctm_park_handover.py tests/test_jetlink_ctm_contract.py tests/test_jetlink_ctm_authority_gate.py selfdrive/modeld/modeld.py system/manager/process_config.py tools/check_jetlink_ctm_authority.py
          bash -n tools/jetlink_ctm_markers.sh
          bash -n tools/run_jetlink_ctm_park.sh
          bash -n tools/run_jetlink_ctm_handover_park.sh
          bash -n tools/disarm_jetlink_ctm_authority.sh
      - name: Exact CTM identity, 50ms telemetry and fail-closed authority markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          source=Path("openpilot/jetlink_shadow_bench.py").read_text()
          ast.parse(source)
          assert "'ctm': ('e8d821733be15ebe9e27498bc27ad8bbbd741980ece37d77f377294010b8ff28', 765950064)" in source
          assert "--model', choices=('ls2', 'ctm')" in source
          assert 'preprocess_plus_wire_ms' in source and 'complete_path_over_50_ms' in source
          control=Path("openpilot/jetlink_authority.py").read_text()
          assert "if Path('/data/jetlink_xnor/CTM_PARKED_TEST_ENABLED').exists():" in control
          marker=Path("tools/jetlink_ctm_markers.sh").read_text()
          parked=Path("tools/run_jetlink_ctm_park.sh").read_text()
          for path in (marker, parked):
              assert 'AUTHORITY_ENABLED' in path and 'LS2_AUTHORITY_QUALIFIED' in path and 'CTM_AUTHORITY_QUALIFIED' in path
          assert '--model ctm --mode camera --pacing timer' in parked
          assert '--seconds 180 --rate 20 --pipeline-depth 2' in parked
          assert '--fetch-stage-report' in parked
          print('CTM parked-only configuration and guards verified')
          PY
      - name: CTM contract, approvals, revocation and USB route regression tests
        run: |
          PYTHONPATH="$PWD" python3 -m unittest discover -s tests -p test_jetlink_ctm_contract.py -v
          PYTHONPATH="$PWD" python3 -m unittest discover -s tests -p test_jetlink_usb_peer.py -v
          PYTHONPATH="$PWD" python3 -m unittest discover -s tests -p test_jetlink_ctm_authority_gate.py -v
      - name: Guarded production selection and isolated parked adapter invariants
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          adapter=Path("openpilot/jetlink_ctm_adapter.py").read_text()
          harness=Path("openpilot/jetlink_ctm_park_handover.py").read_text()
          launcher=Path("tools/run_jetlink_ctm_handover_park.sh").read_text()
          modeld=Path("selfdrive/modeld/modeld.py").read_text()
          for content in (adapter, harness):
              ast.parse(content)
          assert "def attach_authority(" in adapter
          assert "CTM authority NOT QUALIFIED" in adapter
          assert "lease_alive(approval)" in adapter
          assert "GuardedCTMJoiner" in adapter
          assert "def attach_parked(" in adapter
          assert "JETLINK_CTM_ISOLATED_PARKED_TEST" in adapter
          assert "jet.attach_parked(local" in harness
          assert "model._active.client.t.close()" in harness
          assert "CTM_AUTHORITY_NOT_QUALIFIED" in launcher
          assert "CTM_AUTHORITY_ENABLED" in launcher
          assert "jetlink_ctm_adapter.requested()" in modeld, "Explicit CTM selection missing"
          assert "jetlink_ctm_adapter.attach_authority(" in modeld
          assert "model = jetlink_authority.attach(" in modeld, "LS2 path unexpectedly removed"
          guard=Path("openpilot/jetlink_ctm_authority_gate.py").read_text()
          assert "CTM_AUTHORITY_NOT_QUALIFIED" in guard
          assert "CTM_AUTHORITY_STOP" in guard
          assert "numerical_parity" in guard and "onroad_shadow" in guard and "parked_fallback" in guard
          assert ".touch(" not in guard and ".write_text(" not in guard, "Gate must never grant itself approval"
          config=Path("system/manager/process_config.py").read_text()
          assert "os.path.isfile('/data/jetlink_xnor/CTM_AUTHORITY_ENABLED')" in config
          print("CTM guarded modeld select/fallback; no automatic qualification or arm")
          PY
