name: CTM parked-only Jetlink integration syntax and guard checks
on:
  push:
    branches: [xnor-dev]
    paths:
      - '.github/workflows/ctm-park-integration-check.yml'
      - 'openpilot/jetlink_shadow_bench.py'
      - 'openpilot/jetlink_authority.py'
      - 'openpilot/jetlink_ctm_contract.py'
      - 'openpilot/jetlink_ctm_adapter.py'
      - 'openpilot/jetlink_ctm_park_handover.py'
      - 'tools/run_jetlink_ctm_handover_park.sh'
      - 'tests/test_jetlink_ctm_contract.py'
      - 'tools/jetlink_ctm_markers.sh'
      - 'tools/run_jetlink_ctm_park.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python and Bash syntax
        run: |
          set -euo pipefail
          python3 -m py_compile openpilot/jetlink_shadow_bench.py openpilot/jetlink_authority.py
          python3 -m py_compile openpilot/jetlink_ctm_contract.py openpilot/jetlink_ctm_adapter.py openpilot/jetlink_ctm_park_handover.py tests/test_jetlink_ctm_contract.py
          bash -n tools/jetlink_ctm_markers.sh
          bash -n tools/run_jetlink_ctm_park.sh
          bash -n tools/run_jetlink_ctm_handover_park.sh
      - name: Exact CTM identity, 50ms telemetry and fail-closed authority markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          source=Path("openpilot/jetlink_shadow_bench.py").read_text()
          ast.parse(source)
          assert "'ctm': ('e8d821733be15ebe9e27498bc27ad8bbbd741980ece37d77f377294010b8ff28', 765950064)" in source
          assert "--model', choices=('ls2', 'ctm')" in source
          assert 'preprocess_plus_wire_ms' in source and 'complete_path_over_50_ms' in source
          control=Path("openpilot/jetlink_authority.py").read_text()
          assert "if Path('/data/jetlink_xnor/CTM_PARKED_TEST_ENABLED').exists():" in control
          marker=Path("tools/jetlink_ctm_markers.sh").read_text()
          parked=Path("tools/run_jetlink_ctm_park.sh").read_text()
          for path in (marker, parked):
              assert 'AUTHORITY_ENABLED' in path and 'LS2_AUTHORITY_QUALIFIED' in path and 'CTM_AUTHORITY_QUALIFIED' in path
          assert '--model ctm --mode camera --pacing timer' in parked
          assert '--seconds 180 --rate 20 --pipeline-depth 2' in parked
          assert '--fetch-stage-report' in parked
          print('CTM parked-only configuration and guards verified')
          PY
      - name: CTM model spec, USB route and no-authority regression tests
        run: |
          PYTHONPATH="$PWD" python3 -m unittest discover -s tests -p test_jetlink_ctm_contract.py -v
      - name: Isolated-only CTM adapter wiring invariant
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          adapter=Path("openpilot/jetlink_ctm_adapter.py").read_text()
          harness=Path("openpilot/jetlink_ctm_park_handover.py").read_text()
          launcher=Path("tools/run_jetlink_ctm_handover_park.sh").read_text()
          modeld=Path("selfdrive/modeld/modeld.py").read_text()
          for content in (adapter, harness):
              ast.parse(content)
          assert "def attach_authority(" in adapter
          assert "CTM authority is NOT QUALIFIED" in adapter
          assert "def attach_parked(" in adapter
          assert "JETLINK_CTM_ISOLATED_PARKED_TEST" in adapter
          assert "jet.attach_parked(local" in harness
          assert "model._active.client.t.close()" in harness
          assert "CTM_AUTHORITY_NOT_QUALIFIED" in launcher
          assert "CTM_AUTHORITY_ENABLED" in launcher
          assert "jetlink_ctm_adapter" not in modeld, "CTM is not production-wired yet"
          print("CTM adapter is restricted to independent non-publishing parked test")
          PY
