name: V244 ALC direct path and VSL shadow validation

on:
  push:
    branches:
      - xnor-dev-v244-alc-direct-path
    paths:
      - .github/workflows/v244-alc-direct-path.yml
      - selfdrive/controls/lib/desire_helper.py
      - opendbc_repo/opendbc/car/tesla/carcontroller.py
      - selfdrive/speed_limit_vision_uk.py
      - selfdrive/vsl_v3/export_shadow_samples.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        run: |
          python -m py_compile selfdrive/controls/lib/desire_helper.py
          python -m py_compile opendbc_repo/opendbc/car/tesla/carcontroller.py
          python -m py_compile selfdrive/speed_limit_vision_uk.py
          python -m py_compile selfdrive/vsl_v3/export_shadow_samples.py

      - name: Verify Unity-style direct ALC routing
        run: |
          python - <<'PY'
          import ast

          def class_with_methods(path, class_name, names):
            tree = ast.parse(open(path).read(), path)
            cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == class_name)
            methods = []
            for n in cls.body:
              if isinstance(n, ast.FunctionDef) and n.name in names:
                methods.append(n)
            assert len(methods) == len(names), (path, names, [m.name for m in methods])
            mod = ast.fix_missing_locations(ast.Module(body=[
              ast.ClassDef(name="T", bases=[], keywords=[], body=methods, decorator_list=[])
            ], type_ignores=[]))
            ns = {}
            exec(compile(mod, path, "exec"), ns)
            return ns["T"]

          D = class_with_methods(
            "selfdrive/controls/lib/desire_helper.py", "DesireHelper",
            {"_v244_direct_alc_ready"},
          )
          assert D._v244_direct_alc_ready(False, False) is True
          assert D._v244_direct_alc_ready(True, False) is True
          assert D._v244_direct_alc_ready(True, True) is False

          C = class_with_methods(
            "opendbc_repo/opendbc/car/tesla/carcontroller.py", "CarController",
            {"_v211_lane_change_route"},
          )
          kw = dict(native_alc_active=False, native_lkas=False, op_request=True,
                    epas_healthy=False, coop_rearm=False, coop_failed=False)
          assert C._v211_lane_change_route(**kw) == "OP_IDLE_CARRIER"
          assert C._v211_lane_change_route(**{**kw, "native_lkas": True}) == "NATIVE_LKAS_BLOCK"
          assert C._v211_lane_change_route(**{**kw, "coop_rearm": True}) == "WAIT_EPAS"
          assert C._v211_lane_change_route(**{**kw, "coop_failed": True}) == "WAIT_EPAS"
          print("V244 ALC route tests: PASS")
          PY

      - name: Verify existing ALC delay retained
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TinklaAlcDelay' selfdrive/controls/lib/desire_helper.py
          grep -q 'TinklaALCDelay' selfdrive/controls/lib/desire_helper.py
          grep -q '_tinkla_alc_delay_s' selfdrive/controls/lib/desire_helper.py
          grep -q 'auto_start = (time.monotonic() - self._pre_lane_change_start_t) >= self._tinkla_alc_delay_s' selfdrive/controls/lib/desire_helper.py

      - name: Verify VSL remains shadow-only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V1.16 / V244' selfdrive/speed_limit_vision_uk.py
          grep -q 'xnor_vsl_shadow_samples/v244' selfdrive/speed_limit_vision_uk.py
          grep -q 'V3_DISAGREE' selfdrive/speed_limit_vision_uk.py
          grep -q 'authoritative=0' selfdrive/speed_limit_vision_uk.py
          grep -q 'v244_shadow_samples.zip' selfdrive/vsl_v3/export_shadow_samples.py

      - name: Package changed source
        uses: actions/upload-artifact@v4
        with:
          name: v244-alc-direct-path-source
          path: |
            selfdrive/controls/lib/desire_helper.py
            opendbc_repo/opendbc/car/tesla/carcontroller.py
            selfdrive/speed_limit_vision_uk.py
            selfdrive/vsl_v3/export_shadow_samples.py
          retention-days: 14
