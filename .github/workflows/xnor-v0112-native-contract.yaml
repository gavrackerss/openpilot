name: XNOR native v0.11.2 integration contract

on:
  push:
    branches:
      - 'upgrade/xnor-v0112-native-integration'
    paths:
      - 'openpilot/jetlink_v0112_native.py'
      - 'openpilot/jetlink_native_authority.py'
      - 'tools/xnor_v0112_action_contract.py'
      - 'tools/xnor_v0112_tesla_preflight.py'
      - 'openpilot/cereal/**'
      - 'openpilot/common/params_keys.h'
      - '.gitmodules'
      - 'migration/tesla_opendbc_legacy/**'
      - 'migration/tesla_v0112/**'
      - 'migration/sunnypilot_v0112/**'
      - 'openpilot/selfdrive/car/card.py'
      - 'tests/test_xnor_v0112_*'
      - '.github/workflows/xnor-v0112-native-contract.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-staging-contract:
    name: Zero-dependency source checks (NOT a road safety test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Verify v0.11.2 integration boundaries and Tesla snapshots
        run: python3 tests/test_xnor_v0112_native_contract.py -v
      - name: Verify XNOR Cereal wire IDs and services
        run: python3 tests/test_xnor_v0112_schema_contract.py -v
      - name: Verify native Params key migration
        run: python3 tests/test_xnor_v0112_params_contract.py -v
      - name: Check out exact pinned XNOR opendbc for static Tesla contracts
        run: git submodule update --init opendbc_repo
      - name: Audit Tesla HW and custom safety flags against native dependency
        run: |
          python3 tools/xnor_v0112_tesla_preflight.py
          python3 tests/test_xnor_v0112_tesla_preflight.py -v
      - name: Verify SunnyPilot catalog selection remains stock-only
        run: python3 tests/test_xnor_v0112_sunnypilot_catalog.py -v
      - name: Verify staged Tesla IC state port
        run: python3 tests/test_xnor_v0112_tesla_ic_contract.py -v
      - name: Audit native versus Pixel action-head interfaces
        run: python3 tools/xnor_v0112_action_contract.py
      - name: Check Python syntax
        run: |
          python3 -m py_compile \
            openpilot/jetlink_v0112_native.py \
            openpilot/jetlink_native_authority.py \
            tools/xnor_v0112_action_contract.py \
            tools/xnor_v0112_tesla_preflight.py \
            tests/test_xnor_v0112_tesla_preflight.py \
            migration/tesla_v0112/ic_model_snapshot.py \
            migration/sunnypilot_v0112/catalog_guard.py \
            tests/test_xnor_v0112_sunnypilot_catalog.py \
            tests/test_xnor_v0112_native_contract.py \
            tests/test_xnor_v0112_tesla_ic_contract.py \
            tests/test_xnor_v0112_schema_contract.py \
            tests/test_xnor_v0112_params_contract.py

# This workflow cannot validate Cap'n Proto C++ generation, panda safety,
# native Tinygrad, Pixel inference, Tesla behavior or road stopping.
